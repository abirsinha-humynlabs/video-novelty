[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "novelty"
version = "0.1.0"
description = "Detect redundant video and select maximally-diverse subsets, for physical-AI datasets"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "opencv-python-headless>=4.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# Learned backbones. Install this on the GPU box; the repo runs without it.
# pillow: HF AutoImageProcessor hard-requires it; torchvision: AutoVideoProcessor
# (V-JEPA 2) hard-requires it; einops: Cosmos-Embed1's trust_remote_code modeling
# file imports it. None are pulled in by torch/transformers alone.
gpu = ["torch>=2.1", "torchvision>=0.16", "transformers>=4.45", "scikit-learn>=1.2",
       "pillow>=10.0", "einops>=0.7"]
# Supervised threshold/weight fitting (`novelty calibrate --labels`).
fit = ["scikit-learn>=1.2"]
# Approximate nearest neighbour, for corpora past ~1e5 signatures.
ann = ["faiss-cpu>=1.7"]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
novelty = "novelty.cli:main"

[tool.setuptools.packages.find]
include = ["novelty*"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
