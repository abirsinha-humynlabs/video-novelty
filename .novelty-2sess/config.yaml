appearance:
  encoder: dinov2
  n_frames: 64
  width: 448
  height: 252
  letterbox: true
  static_mask: true
  static_percentile: 20.0
  static_floor: 0.15
  bottom_crop: 0.0
  encoder_kwargs:
    batch_size: 64
    dtype: float16
motion:
  enabled: true
  fps: 12.0
  width: 224
  height: 126
  max_seq: 384
  backend: farneback
  letterbox: true
  smooth_s: 0.5
  clip_encoder: vjepa2
  clip_encoder_kwargs:
    batch_size: 8
    fps: 8.0
hashing:
  enabled: true
  fps: 2.0
  max_hamming: 8
  min_overlap_seconds: 2.0
  # DUPLICATE_SOURCE also needs the match to cover this fraction of a clip.
  # Repetitive bench work repeats a ~5s cycle at a fixed head pose, so
  # disjoint chunks DO contain contiguous matching runs; they just never
  # cover much of the clip, whereas a re-encode covers ~all of it.
  min_overlap_fraction: 0.5
decision:
  env_percentile: 60.0
  task_percentile: 95.0
  use_task_axis: false
segment:
  seconds: 30.0
  hop: 30.0
  drop_last_shorter_than: 5.0
