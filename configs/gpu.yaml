# GPU preset -- the one to actually run on your Linux box.
#
#   pip install -e ".[gpu,fit]"
#   novelty index data/ --config configs/gpu.yaml --index .novelty
#
# Two changes matter and they are not cosmetic:
#   * appearance.encoder: dinov2  -- a real scene representation instead of
#     hand-crafted gradients. This is what makes the environment axis robust
#     to lighting and viewpoint change rather than merely correlated with it.
#   * motion.clip_encoder: vjepa2 -- a learned motion representation. The flow
#     descriptor still runs alongside for rhythm and cycle period, which a
#     16-frame window cannot see.
appearance:
  encoder: dinov2            # or dinov2-large / siglip
  n_frames: 64
  width: 448
  height: 252
  letterbox: true
  static_mask: true
  static_percentile: 20.0
  static_floor: 0.15
  bottom_crop: 0.0
  encoder_kwargs:
    batch_size: 64
    dtype: float16

motion:
  enabled: true
  fps: 12.0
  width: 224
  height: 126
  max_seq: 384
  backend: farneback
  smooth_s: 0.5
  clip_encoder: vjepa2       # or videomae, or null to stay on flow only
  clip_encoder_kwargs:
    batch_size: 8
    fps: 8.0

hashing:
  enabled: true
  fps: 2.0
  max_hamming: 8
  min_overlap_seconds: 2.0

decision:
  env_percentile: 97.0
  task_percentile: 95.0

segment:
  seconds: 30.0
  hop: 15.0
  drop_last_shorter_than: 5.0
