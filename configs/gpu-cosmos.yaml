# GPU preset, Cosmos-Embed1 variant -- identical to configs/gpu.yaml except for
# the tier-2 clip encoder. Run both and compare; do not assume either wins.
#
#   novelty index data/ --config configs/gpu-cosmos.yaml --index .novelty-cosmos
#
# Cosmos-Embed1 is trained on robotics/egocentric video (AgiBot, BridgeV2,
# DROID, RoboNet) rather than Kinetics action clips, so its prior is closer to
# this footage than V-JEPA 2's. It is also text-aligned, which carries the
# caption-collapse risk docs/01 cites against CLIP -- that is why it is wired to
# the task axis only and never to appearance.
#
# fps 2.0 x clip_len 8 == 4 s of context per forward pass. Raising fps shortens
# the span each 8-frame window sees, which is the opposite of what this footage
# needs; widen `segment.seconds` instead.
appearance:
  encoder: dinov2            # or dinov2-large / siglip
  n_frames: 64
  width: 448
  height: 252
  letterbox: true
  static_mask: true
  static_percentile: 20.0
  static_floor: 0.15
  bottom_crop: 0.0
  encoder_kwargs:
    batch_size: 64
    dtype: float16

motion:
  enabled: true
  fps: 12.0
  width: 224
  height: 126
  max_seq: 384
  backend: farneback
  smooth_s: 0.5
  clip_encoder: cosmos-embed1  # NVIDIA Cosmos-Embed1-336p, 768-d
  clip_encoder_kwargs:
    batch_size: 8
    fps: 2.0

hashing:
  enabled: true
  fps: 2.0
  max_hamming: 8
  min_overlap_seconds: 2.0
  # DUPLICATE_SOURCE also needs the match to cover this fraction of a clip.
  # Repetitive bench work repeats a ~5s cycle at a fixed head pose, so
  # disjoint chunks DO contain contiguous matching runs; they just never
  # cover much of the clip, whereas a re-encode covers ~all of it.
  min_overlap_fraction: 0.5

decision:
  # 60 = best-F1 (0.969) over 741 pairs from THREE sessions: two Pipe_Factory
  # stations plus an Automobile_Manufacturing plant. It was 52 when fitted on
  # the two pipe sessions alone; adding a third environment moved it, and at 52
  # 11.3% of genuinely different pairs were called same-place. The threshold
  # tracks the corpus, so re-fit when you add sessions.
  # 62.5 gives zero false positives here and still keeps 90% of true
  # redundants -- prefer it if dropping good footage is the costlier error.
  env_percentile: 60.0
  task_percentile: 95.0
  # task axis is REPORTED but does not gate the verdict: measured best-F1
  # 0.905 vs the env axis's 0.969, correlates +0.82 with it, and ranks an
  # automobile plant closer to pipe-factory A than pipe-factory B is.
  # See config.DecisionConfig for what would turn it back on.
  use_task_axis: false

segment:
  seconds: 30.0
  hop: 15.0
  drop_last_shorter_than: 5.0
